<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Studio</title>
<style>
:root{--bg:#101217;--card:#1a1d24;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e37;--accent:#ff5a66;--chip:#252932;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Noto Sans CJK KR","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 6px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
header .sub{font-size:12px;color:var(--muted)}
main{padding:4px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 8px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--chip);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--accent);color:#fff}
.btn.small{padding:7px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5}
.full{width:100%}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:4px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font:inherit;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:700}
.picker{position:relative;display:block;padding:14px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center;background:var(--chip);font-weight:600}
.picker input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.shot{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#F7F2EB}
.desc{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0}
.prog{font-size:14px;margin:6px 0}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.2s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:70%}}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.ok{color:var(--ok)}
.key{font-family:monospace}
#toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:9;background:#000;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
.post{white-space:pre-wrap;font-size:14px}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;background:var(--chip);color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<header><h1 id="head">Creator Studio</h1><span class="sub" id="sub"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<canvas id="cv" width="1080" height="1440" style="display:none"></canvas>
<script>
"use strict";
// ---- 앱(자바) 연결. 브라우저에서 열면(미리 보기) 흉내만 낸다 ----
const N = window.CSApp || {
  get:k=>localStorage.getItem("v:"+k)||"", set:(k,v)=>localStorage.setItem("v:"+k,v), pcUrl:()=>localStorage.getItem("pc")||"",
  setPcUrl:u=>localStorage.setItem("pc",u), openPc:()=>toast("(미리 보기) PC 화면 열기"), openUrl:u=>window.open(u),
  copy:t=>{navigator.clipboard&&navigator.clipboard.writeText(t);return true}, pasteText:()=>"", shareText:t=>toast("(미리 보기) 공유"),
  saveShare:()=>"(미리 보기) 저장했어요", save:()=>"(미리 보기) 저장했어요",
  makeReel:(id)=>setTimeout(()=>CS._done(id,{ok:true}),300),
  http:(id,spec)=>{const s=JSON.parse(spec);(window.MOCK_HTTP?window.MOCK_HTTP(s):fetch(s.url,{method:s.method||"GET",headers:s.headers,body:s.body}).then(async r=>({status:r.status,text:await r.text()}))).then(r=>CS._done(id,r)).catch(e=>CS._done(id,{status:0,error:String(e)}))}
};
const IOS=/iPhone|iPad/.test(navigator.userAgent);
const CS={cbs:{},n:0,tab:"cardnews",result:null,busy:false,mode:"random",shots:[],linkUrl:""};
CS._done=(id,res)=>{const f=CS.cbs[id];delete CS.cbs[id];if(f)f(res)};
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(k==="value")el.value=v;else el.setAttribute(k,v===true?"":v)}for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid instanceof Node?kid:document.createTextNode(String(kid)))}return el}
function put(...k){$("#main").replaceChildren(...k.flat().filter(x=>x!=null&&x!==false))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3200)}
const S=k=>N.get(k)||"";
const SJ=(k,d)=>{try{return JSON.parse(N.get(k)||"")||d}catch(e){return d}};
const setJ=(k,v)=>N.set(k,JSON.stringify(v));
function http(spec){return new Promise(ok=>{const id="r"+(++CS.n);CS.cbs[id]=ok;N.http(id,JSON.stringify(spec))})}
function native(fn,...args){return new Promise(ok=>{const id="n"+(++CS.n);CS.cbs[id]=ok;N[fn](id,...args)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function copy(t,what){toast(N.copy(t)?(what||"")+" 복사했어요":"복사가 안 됐어요")}

// ---- Claude ----
async function claude(content,schema,max){
  const key=S("claude_key");if(!key)throw new Error("⚙ 설정에서 Claude API 키를 넣거나 'PC에서 가져오기'를 눌러 주세요.");
  const r=await http({method:"POST",url:"https://api.anthropic.com/v1/messages",timeout:300000,
    headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json"},
    body:JSON.stringify({model:S("model")||"claude-opus-5-5",max_tokens:max||8000,messages:[{role:"user",content}],output_config:{format:{type:"json_schema",schema}}})});
  if(r.status!==200){let m=r.error||"";try{m=JSON.parse(r.text).error.message}catch(e){}
    if(r.status===401)throw new Error("Claude API 키가 맞지 않아요. ⚙ 설정을 확인해 주세요.");
    if(r.status===0)throw new Error("인터넷에 연결하지 못했어요: "+m);throw new Error("Claude 오류("+r.status+"): "+m)}
  const d=JSON.parse(r.text);const t=(d.content||[]).find(c=>c.type==="text");if(!t)throw new Error("Claude가 빈 답을 줬어요. 다시 해 주세요.");
  return JSON.parse(t.text)}

// ---- Kie(나노바나나 프로) ----
async function kie(prompt,aspect,progress){
  const key=S("kie_key");if(!key)throw new Error("⚙ 설정에서 Kie API 키를 넣거나 'PC에서 가져오기'를 눌러 주세요.");
  const head={"Authorization":"Bearer "+key,"content-type":"application/json"};
  const kj=r=>{let d={};try{d=JSON.parse(r.text||"{}")}catch(e){}if(r.status===0)throw new Error("인터넷에 연결하지 못했어요");
    if(d.code===401)throw new Error("Kie API 키가 맞지 않아요.");if(d.code===402)throw new Error("Kie 크레딧이 부족해요. kie.ai에서 충전해 주세요.");
    if(d.code!==200)throw new Error("Kie 오류("+(d.code||r.status)+"): "+(d.msg||""));return d.data||{}};
  const made=kj(await http({method:"POST",url:"https://api.kie.ai/api/v1/jobs/createTask",headers:head,
    body:JSON.stringify({model:"nano-banana-pro",input:{prompt:prompt.slice(0,20000),image_input:[],aspect_ratio:aspect,resolution:"2K",output_format:"png"}})}));
  const task=made.taskId;if(!task)throw new Error("Kie가 작업 번호를 주지 않았어요.");
  for(let i=0;i<120;i++){await sleep(5000);progress&&progress(`🎨 Kie가 그림을 그리는 중… (${(i+1)*5}초)`);
    const info=kj(await http({url:"https://api.kie.ai/api/v1/jobs/recordInfo?taskId="+encodeURIComponent(task),headers:{"Authorization":"Bearer "+key}}));
    if(info.state==="success"){let urls=[];try{urls=JSON.parse(info.resultJson||"{}").resultUrls||[]}catch(e){}
      if(!urls.length)throw new Error("Kie가 그림 주소를 주지 않았어요.");
      const img=await http({url:urls[0],binary:true,timeout:120000});if(!img.base64)throw new Error("그림을 내려받지 못했어요("+img.status+")");
      return "data:image/png;base64,"+img.base64}
    if(info.state==="fail")throw new Error("Kie 그림 실패: "+(info.failMsg||"이유 없음"))}
  throw new Error("Kie 그림이 10분 안에 안 나왔어요.")}

// ---- 카드뉴스 문구 ----
const MONTHS=[...Array(12)].map((_,i)=>(i+1)+"月");
const ZODIAC=["おひつじ座","おうし座","ふたご座","かに座","しし座","おとめ座","てんびん座","さそり座","いて座","やぎ座","みずがめ座","うお座"];
const ETO=["ねずみ年","うし年","とら年","うさぎ年","たつ年","へび年","うま年","ひつじ年","さる年","とり年","いぬ年","いのしし年"];
const COLORS=["#E33539","#292D2F","#EC8A19","#338176","#2C6596","#605092","#2E7893","#C44D62","#DE7A1E","#697F1D","#3B3D8C","#C14369"];
const CHAR_CYCLE=["cat","dog","human","animals"];
const ART={
 human:"art: 그 칸을 보여 주는 귀여운 그림 한 개의 설명(영어, 20단어 이내). 사람은 'boy'나 'girl'로 시작(표정+포즈+소품), choice에서 음식·물건이면 그 물건을 귀엽게.",
 cat:"art: 그 칸을 보여 주는 귀여운 그림 한 개의 설명(영어, 20단어 이내). 모든 칸에 귀여운 아기 고양이 캐릭터가 주인공(사람 X). 'kitten'으로 시작하고 칸마다 털색·무늬·표정·포즈·소품을 다르게. choice에서 음식·물건이면 고양이가 그 물건을 안고 있거나 옆에 두게.",
 dog:"art: 그 칸을 보여 주는 귀여운 그림 한 개의 설명(영어, 20단어 이내). 모든 칸에 귀여운 아기 강아지 캐릭터가 주인공(사람 X). 'puppy'로 시작하고 칸마다 견종·표정·포즈·소품을 다르게. choice에서 음식·물건이면 강아지가 그 물건을 안고 있거나 옆에 두게.",
 animals:"art: 그 칸을 보여 주는 귀여운 그림 한 개의 설명(영어, 20단어 이내). 모든 칸에 귀여운 동물 캐릭터(사람 X): 고양이·강아지·토끼·곰·햄스터·펭귄·여우·판다 등을 섞어서, 동물 이름으로 시작. choice에서 음식·물건이면 동물이 그 물건을 안고 있거나 옆에 두게.",
 ref:"art: 그 칸을 보여 주는 귀여운 그림 한 개의 설명(영어, 20단어 이내). 그림 종류는 레퍼런스를 따릅니다: 음식·물건이면 그 음식·물건(일본판으로 바꾼 항목이면 바꾼 것)을, 사람이면 사람('boy'/'girl'), 동물이면 동물. 레퍼런스에 없는 고양이·강아지를 일부러 넣지 않습니다."};
const HINT={cat:" All {n} characters are cute chibi kittens (no humans), each with a different fur color or pattern.",dog:" All {n} characters are cute chibi puppies of different breeds (no humans).",animals:" All {n} characters are cute chibi animals of various kinds (no humans).",human:"",ref:""};
const STYLE="Style: super cute kawaii chibi characters, big round heads (about 2.5-head-tall proportions), large sparkly round eyes, rosy blush cheeks, soft rounded shapes, clean bold black outlines, bright pastel-but-clear flat colors, like popular Japanese LINE stickers.";
const CARD_SCHEMA={type:"object",additionalProperties:false,required:["kind","topic_ko","title_red","title_tail","title_ko","badge","items","caption","caption_ko","hashtags","comment","comment_ko","poll_q","poll_opts"],properties:{
 kind:{type:"string",enum:["month","zodiac","eto","choice"]},topic_ko:{type:"string"},title_red:{type:"string"},title_tail:{type:"string"},title_ko:{type:"string"},
 badge:{type:"string",enum:["位","番",""]},
 items:{type:"array",items:{type:"object",additionalProperties:false,required:["subject","line1","ko1","art"],properties:{subject:{type:"string"},line1:{type:"string"},ko1:{type:"string"},art:{type:"string"}}}},
 caption:{type:"string"},caption_ko:{type:"string"},hashtags:{type:"array",items:{type:"string"}},comment:{type:"string"},comment_ko:{type:"string"},poll_q:{type:"string"},poll_opts:{type:"array",items:{type:"string"}}}};
const COMMON=`[제목] 이미지 맨 위에 아주 굵고 큰 후킹 제목 하나. title_red(빨강) + title_tail(검정)을 이어 읽으면 한눈에 들어오는 제목, 합쳐 전각 14자 이내. 설명조 말고 손이 멈추는 짧고 센 말로, 주제가 다 들어가게.
순위형: title_red는 〇〇(전각 10자 이내, 예: お金が貯まらない), title_tail은 生まれ月ランキング/星座ランキング/干支ランキング. choice: title_red에 주제(예: ケチャップの量), title_tail에 何番派？/はどれ？/ランキング.
[칸] 칸 글은 짧은 한마디 한 줄만: line1 전각 9자 이내. 읽자마자 웃기거나 '있다 있어' 하는 핵심 하나만. 순위형 subject는 1月~12月(또는 별자리·띠)을 한 번씩, 1위가 주제에 가장 들어맞는 항목. choice는 subject가 보기 이름(전각 8자 이내).
line1은 일본어 です・ます체 부드러운 존댓말(반말 금지). 「〜派です」「〜しがち」처럼 짧게 끊어도 됩니다. 일본 사람이 공감하는 일상 소재(LINE 既読, 推し活, コンビニ, 飲み会, お弁当 등). 심한 비하·차별·외모 비하·성적인 내용·실존 인물/브랜드·건강 효과 단정은 쓰지 않습니다. ko1은 line1의 한국어 뜻.
[캡션] caption(일본어): 순위형은 「1位は…まさかのあの月？」+이모지 / 「自分と家族・友だちの生まれ月をチェックしてみてください！」 / 「当たってたら「わかる」、納得いかない人は「異議あり」でコメントしてくださいね🫶」 흐름(별자리·띠는 맞게 바꿈). choice는 【12択】+질문+이모지 / 고른 번호로 성격을 알 수 있다는 말 / 「コメントで番号を教えてください🫶」. 요즘 일본 SNS 말투, 짧은 줄, 이모지 적당히. caption_ko는 한국어 뜻.
첫 줄에는 일본에서 실제로 많이 검색하는 일본어 키워드 3~5개가 자연스럽게 들어가게. hashtags는 그 키워드 위주 3~5개(# 포함).
[고정댓글] comment: 일본어 2줄 이내, A/B·번호·이모지로 바로 답하고 싶어지는 질문 또는 あるある 유도, 결과 스포일러 금지. comment_ko는 한국어 뜻.
[투표] poll_q: 인스타 투표 스티커 질문(일본어 전각 20자 이내), poll_opts: 보기 2~4개(각 전각 10자 이내).`;
function nextChar(){const i=Number(S("char_i")||0);N.set("char_i",String(i+1));return CHAR_CYCLE[i%CHAR_CYCLE.length]}
function history(){return SJ("history",[])}
function remember(c){const hs=history();hs.push({title:c.title_red+c.title_tail,topic:c.topic_ko,at:new Date().toISOString().slice(0,10)});setJ("history",hs.slice(-100))}
function randomPrompt(topic,ch){const recent=history().slice(-40).map(x=>"- "+x.title+" ("+x.topic+")").join("\n");
 return `일본 인스타그램(@huh_archive.jp 같은 계정)에서 반응이 좋은 '한 장짜리 12칸 이미지' 게시물의 문구를 새로 써 주세요.
[틀(kind)] month: 생일 달 순위(subject 1月~12月), zodiac: 별자리 순위(subject ${ZODIAC.join("・")}), eto: 띠 순위(subject ${ETO.join("・")}), choice: 12개 보기 중 하나 고르기(예: 「フライドポテトのケチャップ、あなたは何番派？」). badge는 순위형 '位', choice '番'.
${topic?"[이번 주제] "+topic+" (틀은 주제에 맞게 고르기)":"[이번 주제] 자유. 틀과 주제를 직접 고르되 최근 것과 겹치지 않게, 틀도 골고루."}
${recent?"[최근에 만든 것 — 주제·제목이 겹치면 안 됨]\n"+recent:""}
${COMMON}
items는 정확히 12개.
- ${ART[ch]}`}
function linkPrompt(url,memo,n){return `아래 레퍼런스(일본 또는 한국 인스타 '한 장짜리 여러 칸 이미지' 게시물 캡처${url?", 링크 "+url:""}${memo?", 메모: "+memo:""})의 틀을 그대로 살려 일본판 새 게시물 문구를 써 주세요.
- 레퍼런스의 주제·제목의 뜻과 칸 구성, 칸 수(그대로 ${n?n+"개":"원본 칸 수, 2~20"}), 칸마다의 핵심(어떤 타입·순위·성격인지)은 그대로 살립니다. 다만 직역하지 말고 문장·예시·소재는 일본 사람이 읽고 바로 '있다 있어' 하게 일본 정서·일상에 맞게 자연스럽게 바꿉니다(예: 감자튀김 케첩 찍는 양 → お寿司の醤油 찍는 양). 레퍼런스 문장을 그대로 베끼지 않습니다.
- kind: 생일 달/별자리/띠 순위면 month/zodiac/eto, 그 밖은 choice. badge: 순위면 '位', 번호 고르기면 '番', 번호가 없으면 ''.

function cleanCards(c,n){const kind=c.kind||"choice";let items=(c.items||[]).filter(x=>x&&x.subject);if(n)items=items.slice(0,n);

 const tags=(c.hashtags||[]).map(t=>t.trim()).filter(Boolean).map(t=>t.startsWith("#")?t:"#"+t).slice(0,5);
 return Object.assign(c,{kind,items,hashtags:tags,badge:c.badge==null?(kind==="choice"?"番":"位"):c.badge,suffix:kind==="month"?"生まれ":""})}
function grid(n){if(n===12)return[4,3];const cols=n<=4?2:n<=9?3:4;return[cols,Math.ceil(n/cols)]}
function aspectFor(cols,rows){const want=cols/rows;const opts={"1:1":1,"4:3":4/3,"3:4":.75,"3:2":1.5,"2:3":2/3,"5:4":1.25,"4:5":.8,"16:9":16/9};let best="1:1",d=9;for(const[k,v]of Object.entries(opts)){const e=Math.abs(Math.log(v/want));if(e<d){d=e;best=k}}return best}

function cellArt(sheet,r,c,cols,rows){const cw=sheet.naturalWidth/cols,ch=sheet.naturalHeight/rows,ins=Math.round(Math.min(cw,ch)*.03);
 const x=Math.round(c*cw+ins),y=Math.round(r*ch+ins),w=Math.round(cw-2*ins),hh=Math.round(ch-2*ins);
 const t=document.createElement("canvas");t.width=w;t.height=hh;const g=t.getContext("2d");g.drawImage(sheet,x,y,w,hh,0,0,w,hh);
 const d=g.getImageData(0,0,w,hh).data;let x0=w,y0=hh,x1=-1,y1=-1;
 for(let yy=0;yy<hh;yy+=2)for(let xx=0;xx<w;xx+=2){const k=(yy*w+xx)*4;if(d[k]+d[k+1]+d[k+2]<705){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
 if(x1<0)return{canvas:t,x:0,y:0,w,h:hh};const pad=Math.round(Math.max(w,hh)*.03);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(hh-1,y1+pad);
 // 흰 배경을 카드 칸 흰색과 맞춘다(거의 흰색 → 흰색)
 const img=g.getImageData(0,0,w,hh);const p=img.data;for(let k=0;k<p.length;k+=4){if(p[k]>240&&p[k+1]>240&&p[k+2]>240){p[k]=p[k+1]=p[k+2]=255}}g.putImageData(img,0,0);

function rr(g,x,y,w,hh,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

   g.font=`900 ${p1}px ${FONT}`;g.fillStyle="#E33539";g.fillText(red,(W-g.measureText(red).width)/2,y);y+=p1*1.12;

  if(sheet){const a=cellArt(sheet,r,cc,cols,rows);const bw=cw-14,bh=Math.max(20,textTop-8-areaTop);const k=Math.min(bw/a.w,bh/a.h);const dw=a.w*k,dh=a.h*k;
   const group=dh+8+textH,picY=areaTop+Math.max(0,(areaBottom-areaTop-group)/2);g.drawImage(a.canvas,a.x,a.y,a.w,a.h,x0+cw/2-dw/2,picY,dw,dh);textTop=picY+dh+8}
  // 순위 배지

   if(tiny){g.font=`700 ${Math.round(15*bf)}px ${FONT}`;g.fillText(tiny,bx+wn,y0+9+19*bf)}}

 if(account){const hd=account.startsWith("@")?account:"@"+account;g.font=`400 20px ${FONT}`;g.fillStyle="#9A948E";g.fillText(hd,W/2-g.measureText(hd).width/2,H-50)}

   const d=await claude([{type:"text",text:p}],POST_SCHEMA);const posts=(d.posts||[]).map(s=>s.trim()).filter(Boolean);
   const all=SJ("threads_hist",[]);posts.forEach(t=>all.push({style:style.name,first:t.split("\n")[0].slice(0,60)}));setJ("threads_hist",all.slice(-200));
   out.replaceChildren(...posts.map((t,i)=>h("div",{class:"card"},h("div",{class:"row"},h("b",{class:"grow"},(i+1)+"번째 글"),h("button",{class:"btn small",onclick:()=>copy(t)},"📋 복사"),h("button",{class:"btn small",onclick:()=>N.shareText(t)},"📤 Threads")),h("div",{class:"post"},t))))}

   h("div",{class:"row",style:"margin-top:10px"},newName,h("button",{class:"btn small",onclick:()=>{const n=newName.value.trim();if(!n)return;const all=styles();if(!all.some(x=>x.name===n))all.push({name:n,note:"",samples:"",extra:""});setJ("threads",all);N.set("threads_cur",n);drawThreads()}},"＋ 새 스타일"))))}

// ---- 메모(노션) ----
function drawMemo(){const title=h("input",{placeholder:"제목(비우면 첫 줄)"}),body=h("textarea",{placeholder:"떠오른 아이디어를 적어 주세요"}),tags=h("input",{placeholder:"태그(쉼표로 나눠서)"});

 const btn=h("button",{class:"btn main full",onclick:async()=>{const t=title.value.trim()||body.value.trim().split("\n")[0].slice(0,60);if(!t){toast("메모 내용을 적어 주세요");return}
  btn.disabled=true;const m={title:t,body:body.value,tags:tags.value,at:new Date().toISOString().slice(0,10),sent:false};
  try{if(ok){const props={"제목":{title:[{text:{content:t.slice(0,2000)}}]},"날짜":{date:{start:m.at}}};const tg=m.tags.split(",").map(s=>s.trim().replace(/,/g,"")).filter(Boolean);if(tg.length)props["태그"]={multi_select:tg.map(name=>({name}))};
    const r=await http({method:"POST",url:"https://api.notion.com/v1/pages",headers:{"Authorization":"Bearer "+S("notion_token"),"Notion-Version":"2022-06-28","content-type":"application/json"},
     body:JSON.stringify({parent:{database_id:S("notion_memo_db")},properties:props,children:m.body.split("\n").filter(Boolean).map(l=>({object:"block",type:"paragraph",paragraph:{rich_text:[{text:{content:l.slice(0,2000)}}]}}))})});
    if(r.status!==200){let msg="";try{msg=JSON.parse(r.text).message}catch(e){}throw new Error("노션이 거절했어요("+r.status+"): "+msg)}m.sent=true;toast("노션에 저장했어요")}
   else toast("이 폰에 저장했어요(노션 연결 전)")}
  catch(e){toast(e.message+" — 이 폰에 저장해 뒀어요")}
  local.unshift(m);setJ("memos",local.slice(0,200));btn.disabled=false;drawMemo()}},ok?"📒 노션에 저장":"💾 이 폰에 저장");

// ---- PC ----
function pcOrigin(){try{const u=new URL(N.pcUrl());return u.origin}catch(e){return""}}
function pcKey(){const m=N.pcUrl().match(/#k=([\w-]+)/);return m?m[1]:""}
async function importFromPc(){const o=pcOrigin(),k=pcKey();if(!o||!k){toast("먼저 PC 주소(QR 링크)를 넣어 주세요");return}
 toast("PC에서 가져오는 중…");const r=await http({url:o+"/api/app/settings",headers:{"X-Key":k},timeout:30000});
 if(r.status!==200){let m=r.error||"";try{m=JSON.parse(r.text).error}catch(e){}toast("PC에서 못 가져왔어요: "+(m||r.status));return}
 const d=JSON.parse(r.text);let n=0;for(const k2 of["claude_key","model","kie_key","notion_token","notion_memo_db","telegram_token","telegram_chat","account"]){if(d[k2]){N.set(k2,d[k2]);n++}}
 if(Array.isArray(d.threads)&&d.threads.length){setJ("threads",d.threads);n++}
 toast(`✅ PC에서 ${n}가지를 가져왔어요. 이제 PC 없이도 돼요`);drawSettings()}

  h("div",{class:"card"},h("h2",{},"🔑 PC 설정 가져오기"),h("p",{class:"muted"},"PC가 켜져 있을 때 한 번만 누르면 Claude·Kie·노션·텔레그램 키와 쓰레드 스타일을 이 폰에 넣어요. 그다음부터 카드뉴스·쓰레드 글·메모는 PC를 꺼도 돼요."),
   h("button",{class:"btn full",onclick:importFromPc},"⬇️ PC에서 가져오기")))}
