<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Creator Studio">
<meta name="theme-color" content="#101217">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#101217;--card:#1a1d24;--text:#eceef2;--muted:#9aa1ad;--line:#2a2e37;--accent:#ff5a66;--chip:#252932;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
header .sub{font-size:12px;color:var(--muted)}
main{padding:4px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 8px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;font-weight:600;background:var(--chip);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--accent);color:#fff}
.btn.small{padding:7px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5}
.full{width:100%}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:4px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font:inherit;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:700}
.picker{position:relative;display:block;padding:14px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center;background:var(--chip);font-weight:600}
.picker input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.shot{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#F7F2EB}
.part{margin-top:12px;border-top:1px solid rgba(127,127,127,.25);padding-top:10px}.part .row{align-items:center}
.desc{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0}
.prog{font-size:14px;margin:6px 0}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.2s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:70%}}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.ok{color:var(--ok)}
.key{font-family:monospace}
#toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:9;background:#000;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
.post{white-space:pre-wrap;font-size:14px}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;background:var(--chip);color:var(--muted);margin-left:6px}
.big{font-size:26px;font-weight:800;margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.chip{border:0;border-radius:99px;padding:6px 12px;background:var(--chip);color:var(--muted);font:inherit;font-size:13px;white-space:nowrap}.chip.on{background:var(--accent);color:#fff}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.menuitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:14px;margin:6px 0;font:inherit}
.menuitem .mi{font-size:24px}.menuitem b{display:block}
.remotewrap{position:relative;overflow:auto;border-radius:10px;border:1px solid var(--line);background:#000;max-height:70vh}.remotewrap .remote{display:block;width:100%;touch-action:manipulation}
.remotewrap.zoom .remote{width:220%;max-width:none}.dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(255,90,102,.6);border:2px solid #fff;pointer-events:none}
.tag.st-failed,.tag.st-needs_check{background:#5a1d22;color:#ffb3b8}.tag.st-done{background:#163a26;color:#86efac}.tag.st-uploading{background:#3a3214;color:#fde68a}
/* Z폴드 펼친 화면(넓이 700px 이상): 왼쪽 메뉴 + 두 칸 */
body.wide header{display:none}
body.wide nav{top:0;bottom:0;right:auto;width:228px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 8px 10px;overflow-y:auto}
body.wide nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px}
body.wide nav button span{font-size:18px}body.wide nav button.on{background:var(--chip)}
.railhead{font-weight:800;font-size:17px;padding:8px 12px 12px}
body.wide main{margin-left:228px;padding:calc(16px + env(safe-area-inset-top)) 22px 30px;columns:2;column-gap:16px}
body.wide main>*{break-inside:avoid}
body.wide main.single{columns:1;max-width:1100px}
body.wide main>.gridcards{column-span:all}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
body.wide .gridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 12px}
body.wide #toast{left:250px;bottom:20px}
body.wide .remotewrap{max-height:calc(100vh - 220px)}
</style>
</head>
<body>
<header><h1 id="head">Creator Studio</h1><span class="sub" id="sub"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<canvas id="cv" width="1080" height="1440" style="display:none"></canvas>
<script>
"use strict";
// ---- 앱(자바) 연결. 브라우저에서 열면(미리 보기) 흉내만 낸다 ----
// 웹(아이폰 홈 화면 웹앱)에서는 브라우저 기능으로 같은 일을 한다. 테스트는 window.MOCK_HTTP로 요청을 흉내 낸다.
const WEB=!window.CSApp;
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function blobToB64(blob){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",",2)[1]||"");fr.onerror=()=>no(fr.error);fr.readAsDataURL(blob)})}
function webShare(file,text){const data={files:[file]};if(text)data.text=text;
  if(navigator.canShare&&navigator.canShare(data)){navigator.share(data).catch(()=>{});return "공유 창을 열었어요(‘이미지 저장’·‘비디오 저장’을 누르면 사진 앱에 저장돼요)"}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.append(a);a.click();a.remove();return "내려받았어요"}
async function webHttp(s){
  if(window.MOCK_HTTP)return window.MOCK_HTTP(s);
  const headers=Object.assign({},s.headers||{});if(/api\.anthropic\.com/.test(s.url))headers["anthropic-dangerous-direct-browser-access"]="true";
  let body=s.body;
  if(s.multipart){body=new FormData();for(const[k,v]of Object.entries(s.multipart.fields||{}))body.append(k,v);
    for(const f of s.multipart.files||[])body.append(f.field,b64ToBlob(f.base64,f.mime||"application/octet-stream"),f.filename);delete headers["content-type"]}
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),s.timeout||300000);
  try{if(s.binary){try{const r=await fetch(s.url,{signal:ctl.signal});if(!r.ok)return{status:r.status,text:""};return{status:r.status,base64:await blobToB64(await r.blob())}}
      catch(e){return await imgFallback(s.url)}}
    const r=await fetch(s.url,{method:s.method||"GET",headers,body,signal:ctl.signal});return{status:r.status,text:await r.text()}}
  catch(e){return{status:0,error:e.name==="AbortError"?"시간이 너무 오래 걸렸어요":String(e.message||e)}}finally{clearTimeout(t)}}
// 그림 서버가 fetch를 막으면 <img>로 읽어 본다(서버가 허락해야 캔버스에서 꺼낼 수 있다)
function imgFallback(url){return new Promise(ok=>{const im=new Image();im.crossOrigin="anonymous";
  im.onload=()=>{try{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);ok({status:200,base64:c.toDataURL("image/png").split(",")[1]})}catch(e){ok({status:0,error:"그림 서버가 웹앱에서 그림 꺼내기를 막았어요"})}};
  im.onerror=()=>ok({status:0,error:"그림을 내려받지 못했어요(그림 서버가 막음)"});im.src=url})}
// 카드 PNG → 8초 세로 영상(사파리는 mp4, 다른 브라우저는 webm). 실제 시간만큼(8초) 걸린다.
async function webReel(b64){const im=new Image();im.src="data:image/png;base64,"+b64;await im.decode();
  const c=document.createElement("canvas");c.width=1080;c.height=1920;const g=c.getContext("2d");
  const paint=()=>{g.fillStyle="#F7F2EB";g.fillRect(0,0,1080,1920);const h=Math.round(im.height*1080/im.width);g.drawImage(im,0,Math.round((1920-h)/2),1080,h)};paint();
  const type=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!type)throw new Error("이 브라우저는 영상 만들기를 못 해요");
  const stream=c.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:6000000});const parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);rec.start(500);const t0=performance.now();
  while(performance.now()-t0<8000){paint();await new Promise(r=>requestAnimationFrame(r))}
  rec.stop();await done;stream.getTracks().forEach(t=>t.stop());return new Blob(parts,{type:type.split(";")[0]})}
const N = window.CSApp || {
  get:k=>{try{return localStorage.getItem("v:"+k)||""}catch(e){return""}}, set:(k,v)=>{try{localStorage.setItem("v:"+k,v)}catch(e){}},
  pcUrl:()=>{try{return localStorage.getItem("pc")||""}catch(e){return""}}, setPcUrl:u=>{try{localStorage.setItem("pc",(u||"").trim())}catch(e){}},
  openPc:()=>{const u=N.pcUrl();if(!u){toast("⚙ 설정에 PC 주소(텔레그램으로 온 링크)를 넣어 주세요");CS.go("settings");return}window.open(u,"_blank")},
  openUrl:u=>window.open(u,"_blank"),
  copy:t=>{try{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;opacity:0";document.body.append(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand("copy");ta.remove();if(ok)return true}catch(e){}
    if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>{});return true}return false},
  pasteText:()=>navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText().catch(()=>""):"",
  shareText:t=>{if(navigator.share)navigator.share({text:t}).catch(()=>{});else{N.copy(t);toast("복사했어요. Threads에 붙여 넣어 주세요")}},
  saveShare:(name,mime,b64,text)=>webShare(new File([b64ToBlob(b64,mime)],name,{type:mime}),text),
  save:()=>"‘📸 인스타에 올리기’나 ‘📤 저장·공유’를 누르면 사진 앱에 저장하거나 인스타로 보낼 수 있어요",
  makeReel:(id,name,b64)=>{webReel(b64).then(blob=>{const ext=blob.type.includes("mp4")?".mp4":".webm";CS.reelFile=new File([blob],name.replace(/\.mp4$/,ext),{type:blob.type});CS._done(id,{ok:true,web:true})}).catch(e=>CS._done(id,{ok:false,error:e.message||String(e)}))},
  http:(id,spec)=>{webHttp(JSON.parse(spec)).then(r=>CS._done(id,r)).catch(e=>CS._done(id,{status:0,error:String(e)}))}
};
const IOS=/iPhone|iPad/.test(navigator.userAgent);
const CS={cbs:{},n:0,tab:"cardnews",result:null,busy:false,mode:"random",shots:[],linkUrl:""};
CS._done=(id,res)=>{const f=CS.cbs[id];delete CS.cbs[id];if(f)f(res)};
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(k==="value")el.value=v;else el.setAttribute(k,v===true?"":v)}for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid instanceof Node?kid:document.createTextNode(String(kid)))}return el}
function put(...k){$("#main").replaceChildren(...k.flat().filter(x=>x!=null&&x!==false))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3200)}
const S=k=>N.get(k)||"";
const SJ=(k,d)=>{try{return JSON.parse(N.get(k)||"")||d}catch(e){return d}};
const setJ=(k,v)=>N.set(k,JSON.stringify(v));
function http(spec){return new Promise(ok=>{const id="r"+(++CS.n);CS.cbs[id]=ok;N.http(id,JSON.stringify(spec))})}
function native(fn,...args){return new Promise(ok=>{const id="n"+(++CS.n);CS.cbs[id]=ok;N[fn](id,...args)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function copy(t,what){toast(N.copy(t)?(what||"")+" 복사했어요":"복사가 안 됐어요")}

// ---- Claude ----
async function claude(content,schema,max){
  const key=S("claude_key");if(!key)throw new Error("⚙ 설정에서 Claude API 키를 넣거나 'PC에서 가져오기'를 눌러 주세요.");
  const r=await http({method:"POST",url:"https://api.anthropic.com/v1/messages",timeout:300000,
    headers:{"x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json"},
    body:JSON.stringify({model:S("model")||"claude-opus-5-5",max_tokens:max||8000,messages:[{role:"user",content}],output_config:{format:{type:"json_schema",schema}}})});
  if(r.status!==200){let m=r.error||"";try{m=JSON.parse(r.text).error.message}catch(e){}
    if(r.status===401)throw new Error("Claude API 키가 맞지 않아요. ⚙ 설정을 확인해 주세요.");
    if(r.status===0)throw new Error("인터넷에 연결하지 못했어요: "+m);throw new Error("Claude 오류("+r.status+"): "+m)}
  const d=JSON.parse(r.text);const t=(d.content||[]).find(c=>c.type==="text");if(!t)throw new Error("Claude가 빈 답을 줬어요. 다시 해 주세요.");
  return JSON.parse(t.text)}

// ---- Kie(나노바나나 프로) ----
async function kie(prompt,aspect,progress){
  const key=S("kie_key");if(!key)throw new Error("⚙ 설정에서 Kie API 키를 넣거나 'PC에서 가져오기'를 눌러 주세요.");
  const head={"Authorization":"Bearer "+key,"content-type":"application/json"};
  const kj=r=>{let d={};try{d=JSON.parse(r.text||"{}")}catch(e){}if(r.status===0)throw new Error("인터넷에 연결하지 못했어요");
    if(d.code===401)throw new Error("Kie API 키가 맞지 않아요.");if(d.code===402)throw new Error("Kie 크레딧이 부족해요. kie.ai에서 충전해 주세요.");
    if(d.code!==200)throw new Error("Kie 오류("+(d.code||r.status)+"): "+(d.msg||""));return d.data||{}};
  const made=kj(await http({method:"POST",url:"https://api.kie.ai/api/v1/jobs/createTask",headers:head,
    body:JSON.stringify({model:"nano-banana-pro",input:{prompt:prompt.slice(0,20000),image_input:[],aspect_ratio:aspect,resolution:"2K",output_format:"png"}})}));
  const task=made.taskId;if(!task)throw new Error("Kie가 작업 번호를 주지 않았어요.");
  for(let i=0;i<120;i++){await sleep(5000);progress&&progress(`🎨 Kie가 그림을 그리는 중… (${(i+1)*5}초)`);
    const info=kj(await http({url:"https://api.kie.ai/api/v1/jobs/recordInfo?taskId="+encodeURIComponent(task),headers:{"Authorization":"Bearer "+key}}));
    if(info.state==="success"){let urls=[];try{urls=JSON.parse(info.resultJson||"{}").resultUrls||[]}catch(e){}
      if(!urls.length)throw new Error("Kie가 그림 주소를 주지 않았어요.");
      const img=await http({url:urls[0],binary:true,timeout:120000});if(!img.base64)throw new Error("그림을 내려받지 못했어요("+img.status+")");
      return "data:image/png;base64,"+img.base64}
    if(info.state==="fail")throw new Error("Kie 그림 실패: "+(info.failMsg||"이유 없음"))}
  throw new Error("Kie 그림이 10분 안에 안 나왔어요.")}

// ---- 카드뉴스 문구 ----
const MONTHS=[...Array(12)].map((_,i)=>(i+1)+"月");
const ZODIAC=["おひつじ座","おうし座","ふたご座","かに座","しし座","おとめ座","てんびん座","さそり座","いて座","やぎ座","みずがめ座","うお座"];
const ETO=["ねずみ年","うし年","とら年","うさぎ年","たつ年","へび年","うま年","ひつじ年","さる年","とり年","いぬ年","いのしし年"];
const COLORS=["#E33539","#292D2F","#EC8A19","#338176","#2C6596","#605092","#2E7893","#C44D62","#DE7A1E","#697F1D","#3B3D8C","#C14369"];
const CHAR_CYCLE=["cat","dog","human","animals"];
const ART={
 human:"art: 그 칸을 보여 주는 귀여운 그림 한 개의 설명(영어, 20단어 이내). 사람은 'boy'나 'girl'로 시작(표정+포즈+소품), choice에서 음식·물건이면 그 물건을 귀엽게.",

function cellArt(sheet,r,c,cols,rows){const cw=sheet.naturalWidth/cols,ch=sheet.naturalHeight/rows,ins=Math.round(Math.min(cw,ch)*.03);

 for(let yy=0;yy<hh;yy+=2)for(let xx=0;xx<w;xx+=2){const k=(yy*w+xx)*4;if(d[k]+d[k+1]+d[k+2]<705){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
